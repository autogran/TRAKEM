<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TRAKEM" />
  <meta name="theme-color" content="#0B0B0B" />
  <title>TRAKEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0B0B0B;
      --green:    #00FF88;
      --yellow:   #F1D302;
      --slate:    #6B818C;
      --white:    #FFFFFF;
      --glass-bg: rgba(11,11,11,0.70);
    }

    html, body {
      background: var(--bg);
      min-height: 100%;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(107,129,140,0.3); border-radius: 2px; }

    /* ── Animations ── */
    @keyframes fadeUp   { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @keyframes revealScale { from { opacity:0; transform:scale(0.94); } to { opacity:1; transform:scale(1); } }
    @keyframes pulseDot { 0%,100% { box-shadow:0 0 8px var(--green); } 50% { box-shadow:0 0 18px var(--green); } }
    @keyframes orbPulse {
      0%   { opacity: 0.55; transform: scale(1);    filter: blur(7px); }
      50%  { opacity: 1;    transform: scale(1.22); filter: blur(5px); }
      100% { opacity: 0.55; transform: scale(1);    filter: blur(7px); }
    }
    @keyframes orbPulseAlt {
      0%   { opacity: 0.45; transform: scale(1.1);  filter: blur(9px); }
      50%  { opacity: 0.90; transform: scale(0.88); filter: blur(6px); }
      100% { opacity: 0.45; transform: scale(1.1);  filter: blur(9px); }
    }
    @keyframes coreFlicker {
      0%,100% { opacity: 1;    transform: scale(1); }
      30%     { opacity: 0.75; transform: scale(0.92); }
      60%     { opacity: 0.95; transform: scale(1.06); }
      80%     { opacity: 0.85; transform: scale(0.97); }
    }
    @keyframes scanline { from { transform:translateY(-100vh); } to { transform:translateY(100vh); } }
    @keyframes modalIn  { from { opacity:0; transform:scale(0.92) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
    @keyframes tokenPop { 0% { transform:scale(1); } 50% { transform:scale(1.18); } 100% { transform:scale(1.06); } }

    /* ── Layout ── */
    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 52px;
      position: relative;
      overflow: hidden;
    }

    /* Scanline shimmer */
    .app::before {
      content: '';
      position: fixed;
      left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(0,255,136,0.07), transparent);
      animation: scanline 9s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    /* ── SVG Background ── */
    .geo-bg {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ── All content above bg ── */
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 28px;
      animation: fadeUp 0.55s 0.05s ease both;
    }
    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 6px;
    }
    .glow-orb {
      position: relative;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    /* outermost halo */
    .glow-orb::before {
      content: '';
      position: absolute;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,136,0.18) 0%, transparent 70%);
      animation: orbPulse 2.8s ease-in-out infinite;
    }
    /* mid halo */
    .glow-orb::after {
      content: '';
      position: absolute;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,136,0.32) 0%, transparent 70%);
      animation: orbPulseAlt 2.8s ease-in-out infinite;
    }
    /* bright core dot */
    .glow-orb-core {
      position: relative;
      z-index: 1;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #00FF88;
      box-shadow:
        0 0 6px 2px rgba(0,255,136,0.9),
        0 0 16px 4px rgba(0,255,136,0.5),
        0 0 32px 8px rgba(0,255,136,0.2);
      animation: coreFlicker 2.8s ease-in-out infinite;
    }
    /* left orb slightly delayed for async feel */
    .glow-orb.left::before  { animation-delay: 0s; }
    .glow-orb.left::after   { animation-delay: 0.3s; }
    .glow-orb.left .glow-orb-core { animation-delay: 0.15s; }
    .glow-orb.right::before { animation-delay: 1.4s; }
    .glow-orb.right::after  { animation-delay: 1.7s; }
    .glow-orb.right .glow-orb-core { animation-delay: 1.55s; }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(46px, 11vw, 66px);
      font-weight: 400;
      color: var(--green);
      letter-spacing: 10px;
      text-shadow: 0 0 30px rgba(0,255,136,0.55), 0 0 70px rgba(0,255,136,0.18);
      line-height: 1;
    }
    .subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: rgba(107,129,140,0.75);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* ── Stats Row ── */
    .stats-row {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 430px;
      margin-bottom: 22px;
      animation: fadeUp 0.55s 0.12s ease both;
    }
    .stat-card {
      flex: 1;
      background: var(--glass-bg);
      border-radius: 18px;
      padding: 18px 20px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
      transition: box-shadow 0.3s ease;
    }
    .stat-card.green { border: 1px solid rgba(0,255,136,0.28); box-shadow: 0 0 24px rgba(0,255,136,0.08); }
    .stat-card.yellow{ border: 1px solid rgba(241,211,2,0.28); box-shadow: 0 0 24px rgba(241,211,2,0.08); }
    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px;
      font-weight: 400;
      letter-spacing: 2px;
      line-height: 1;
      transition: text-shadow 0.3s ease;
    }
    .stat-card.green .stat-value { color: var(--green); text-shadow: 0 0 22px rgba(0,255,136,0.55); }
    .stat-card.yellow .stat-value{ color: var(--yellow); text-shadow: 0 0 22px rgba(241,211,2,0.55); }
    .stat-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: rgba(107,129,140,0.85);
      margin-top: 6px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── Token Panel ── */
    .panel {
      width: 100%;
      max-width: 498px;
      background: var(--glass-bg);
      border: 1px solid rgba(107,129,140,0.20);
      border-radius: 22px;
      padding: 22px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 0 0 1px rgba(0,255,136,0.04), 0 24px 60px rgba(0,0,0,0.55);
      animation: revealScale 0.55s 0.18s ease both;
      opacity: 0;
      animation-fill-mode: forwards;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .panel-title {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: rgba(107,129,140,0.5);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .token-count-badge {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: rgba(107,129,140,0.45);
      letter-spacing: 0.08em;
    }

    /* ── Token Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      justify-items: center;
    }
    @media (max-width: 380px) {
      .grid { grid-template-columns: repeat(5, 1fr); }
    }

    /* ── Token Button ── */
    .token {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1.5px solid rgba(107,129,140,0.28);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.28);
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.22s ease, border-color 0.22s ease,
                  box-shadow 0.22s ease, color 0.22s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      flex-shrink: 0;
      transform: scale(1);
    }
    .token:hover {
      background: rgba(107,129,140,0.14);
      border-color: rgba(107,129,140,0.55);
      color: rgba(255,255,255,0.55);
    }
    .token.patient {
      background: rgba(0,255,136,0.12);
      border-color: rgba(0,255,136,0.60);
      box-shadow: 0 0 16px rgba(0,255,136,0.50), 0 0 38px rgba(0,255,136,0.18), inset 0 0 10px rgba(0,255,136,0.10);
      color: var(--green);
      transform: scale(1.06);
    }
    .token.review {
      background: rgba(241,211,2,0.12);
      border-color: rgba(241,211,2,0.60);
      box-shadow: 0 0 16px rgba(241,211,2,0.50), 0 0 38px rgba(241,211,2,0.18), inset 0 0 10px rgba(241,211,2,0.10);
      color: var(--yellow);
      transform: scale(1.06);
    }
    .token.pop { animation: tokenPop 0.28s ease both; }

    /* ── Action Row ── */
    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      width: 100%;
      max-width: 498px;
      animation: fadeUp 0.55s 0.22s ease both;
    }
    .btn {
      flex: 1;
      height: 48px;
      border-radius: 12px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.22s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: none;
    }
    .btn-add {
      border: 1.5px solid rgba(0,255,136,0.38);
      background: rgba(0,255,136,0.07);
      color: var(--green);
    }
    .btn-add:hover {
      background: rgba(0,255,136,0.15);
      box-shadow: 0 0 18px rgba(0,255,136,0.22);
      transform: translateY(-1px);
    }
    .btn-reset {
      border: 1.5px solid rgba(107,129,140,0.25);
      background: rgba(107,129,140,0.06);
      color: rgba(107,129,140,0.70);
    }
    .btn-reset:hover {
      background: rgba(241,211,2,0.08);
      border-color: rgba(241,211,2,0.38);
      color: var(--yellow);
      box-shadow: 0 0 18px rgba(241,211,2,0.15);
      transform: translateY(-1px);
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 16px;
      animation: fadeUp 0.55s 0.28s ease both;
      opacity: 0;
      animation-fill-mode: forwards;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: rgba(107,129,140,0.65);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .legend-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-dot.green  { background: var(--green);  box-shadow: 0 0 6px rgba(0,255,136,0.6); }
    .legend-dot.yellow { background: var(--yellow); box-shadow: 0 0 6px rgba(241,211,2,0.6); }

    /* ── Modal Overlay ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.80);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .modal-overlay.visible { display: flex; }
    .modal-box {
      background: #111111;
      border: 1px solid rgba(241,211,2,0.28);
      border-radius: 18px;
      padding: 32px 28px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(241,211,2,0.12), 0 20px 60px rgba(0,0,0,0.7);
      animation: modalIn 0.25s ease both;
    }
    .modal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      letter-spacing: 4px;
      color: var(--white);
      margin-bottom: 10px;
    }
    .modal-body {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: rgba(107,129,140,0.8);
      margin-bottom: 26px;
      line-height: 1.8;
      letter-spacing: 0.04em;
    }
    .modal-actions { display: flex; gap: 10px; }
    .modal-cancel, .modal-confirm {
      flex: 1; height: 44px; border-radius: 10px;
      font-family: 'DM Mono', monospace;
      font-size: 11px; letter-spacing: 0.10em;
      text-transform: uppercase; cursor: pointer;
      transition: all 0.2s ease;
    }
    .modal-cancel {
      border: 1px solid rgba(107,129,140,0.25);
      background: transparent;
      color: rgba(107,129,140,0.7);
    }
    .modal-cancel:hover { background: rgba(107,129,140,0.10); color: var(--white); }
    .modal-confirm {
      border: 1px solid rgba(241,211,2,0.42);
      background: rgba(241,211,2,0.10);
      color: var(--yellow);
      font-weight: 500;
    }
    .modal-confirm:hover {
      background: rgba(241,211,2,0.22);
      box-shadow: 0 0 16px rgba(241,211,2,0.22);
    }
  </style>
</head>

<body>

  <!-- ── Geometric Background SVG ── -->
  <svg class="geo-bg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 800 900">
    <defs>
      <radialGradient id="vig" cx="50%" cy="50%" r="70%">
        <stop offset="0%"   stop-color="#0B0B0B" stop-opacity="0"/>
        <stop offset="100%" stop-color="#0B0B0B" stop-opacity="0.88"/>
      </radialGradient>
    </defs>
    <!-- diagonal lines -->
    <line x1="-80" y1="200"  x2="900" y2="-60"  stroke="#6B818C" stroke-width="0.6" stroke-opacity="0.50"/>
    <line x1="-80" y1="400"  x2="900" y2="140"  stroke="#6B818C" stroke-width="0.4" stroke-opacity="0.35"/>
    <line x1="-80" y1="650"  x2="900" y2="390"  stroke="#6B818C" stroke-width="0.6" stroke-opacity="0.40"/>
    <line x1="-80" y1="900"  x2="900" y2="640"  stroke="#6B818C" stroke-width="0.4" stroke-opacity="0.28"/>
    <line x1="300" y1="-20"  x2="100" y2="950"  stroke="#6B818C" stroke-width="0.5" stroke-opacity="0.28"/>
    <line x1="600" y1="-20"  x2="400" y2="950"  stroke="#6B818C" stroke-width="0.4" stroke-opacity="0.22"/>
    <!-- corner brackets -->
    <polyline points="30,80 30,30 80,30"    fill="none" stroke="#6B818C" stroke-width="1.1" stroke-opacity="0.60"/>
    <polyline points="720,30 770,30 770,80"  fill="none" stroke="#6B818C" stroke-width="1.1" stroke-opacity="0.60"/>
    <polyline points="30,820 30,870 80,870"  fill="none" stroke="#6B818C" stroke-width="1.1" stroke-opacity="0.40"/>
    <polyline points="720,870 770,870 770,820" fill="none" stroke="#6B818C" stroke-width="1.1" stroke-opacity="0.40"/>
    <!-- hexagon top-right -->
    <polygon points="700,120 730,100 760,120 760,160 730,180 700,160" fill="none" stroke="#6B818C" stroke-width="0.8" stroke-opacity="0.45"/>
    <!-- circles left -->
    <circle cx="60"  cy="480" r="42" fill="none" stroke="#6B818C" stroke-width="0.7" stroke-opacity="0.32"/>
    <circle cx="60"  cy="480" r="24" fill="none" stroke="#6B818C" stroke-width="0.4" stroke-opacity="0.22"/>
    <!-- circles right -->
    <circle cx="740" cy="680" r="56" fill="none" stroke="#6B818C" stroke-width="0.7" stroke-opacity="0.28"/>
    <circle cx="740" cy="680" r="32" fill="none" stroke="#6B818C" stroke-width="0.4" stroke-opacity="0.18"/>
    <!-- crosshair bottom-centre -->
    <line x1="388" y1="845" x2="412" y2="845" stroke="#6B818C" stroke-width="0.9" stroke-opacity="0.50"/>
    <line x1="400" y1="833" x2="400" y2="857" stroke="#6B818C" stroke-width="0.9" stroke-opacity="0.50"/>
    <circle cx="400" cy="845" r="9" fill="none" stroke="#6B818C" stroke-width="0.8" stroke-opacity="0.45"/>
    <!-- diamond top-centre -->
    <polygon points="400,40 420,58 400,76 380,58" fill="none" stroke="#6B818C" stroke-width="0.9" stroke-opacity="0.50"/>
    <!-- scattered dots -->
    <circle cx="140" cy="110" r="2" fill="#6B818C" fill-opacity="0.38"/>
    <circle cx="260" cy="840" r="2" fill="#6B818C" fill-opacity="0.38"/>
    <circle cx="540" cy="55"  r="2" fill="#6B818C" fill-opacity="0.38"/>
    <circle cx="660" cy="450" r="2" fill="#6B818C" fill-opacity="0.38"/>
    <circle cx="120" cy="720" r="2" fill="#6B818C" fill-opacity="0.38"/>
    <circle cx="680" cy="200" r="2" fill="#6B818C" fill-opacity="0.38"/>
    <circle cx="350" cy="800" r="2" fill="#6B818C" fill-opacity="0.38"/>
    <!-- vignette -->
    <rect x="0" y="0" width="800" height="900" fill="url(#vig)"/>
  </svg>

  <!-- ── App Shell ── -->
  <div class="app">
    <div class="content">

      <!-- Header -->
      <div class="header">
        <div class="logo-row">
          <div class="glow-orb left"><div class="glow-orb-core"></div></div>
          <h1>TRAKEM</h1>
          <div class="glow-orb right"><div class="glow-orb-core"></div></div>
        </div>
        <div class="subtitle">Clinic Token Tracker</div>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card green">
          <div class="stat-value" id="count-patients">0</div>
          <div class="stat-label">Total Patients</div>
        </div>
        <div class="stat-card yellow">
          <div class="stat-value" id="count-reviews">0</div>
          <div class="stat-label">Reviews</div>
        </div>
      </div>

      <!-- Token Panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Tokens</span>
          <span class="token-count-badge" id="token-badge">30 tokens</span>
        </div>
        <div class="grid" id="token-grid"></div>
      </div>

      <!-- Actions -->
      <div class="action-row">
        <button class="btn btn-add" id="btn-add">
          <span style="font-size:18px;line-height:1">+</span> Add 10 Tokens
        </button>
        <button class="btn btn-reset" id="btn-reset">
          <span>↺</span> Reset Day
        </button>
      </div>

      <!-- Legend -->
      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot green"></div> Single tap — New Patient
        </div>
        <div class="legend-item">
          <div class="legend-dot yellow"></div> Double tap — Review
        </div>
      </div>

    </div>
  </div>

  <!-- ── Reset Modal ── -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-title">Reset Day?</div>
      <div class="modal-body" id="modal-body">
        This will clear all tokens and<br>reset both counters to zero.
      </div>
      <div class="modal-actions">
        <button class="modal-cancel"  id="modal-cancel">Cancel</button>
        <button class="modal-confirm" id="modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    const STATE = { IDLE: 'idle', PATIENT: 'patient', REVIEW: 'review' };

    let tokenStates = [];   // array of STATE values
    let tokenCount  = 0;
    let clickTimers = {};   // per-token double-click timer

    // ── DOM refs ───────────────────────────────────────────────────────────────
    const grid          = document.getElementById('token-grid');
    const badge         = document.getElementById('token-badge');
    const countPatients = document.getElementById('count-patients');
    const countReviews  = document.getElementById('count-reviews');
    const modal         = document.getElementById('modal');
    const modalBody     = document.getElementById('modal-body');

    // ── Initialise ─────────────────────────────────────────────────────────────
    function init() {
      const saved = sessionStorage.getItem('trakem-state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          tokenStates = parsed.states;
          tokenCount  = parsed.count;
        } catch {
          tokenStates = Array(30).fill(STATE.IDLE);
          tokenCount  = 30;
        }
      } else {
        tokenStates = Array(30).fill(STATE.IDLE);
        tokenCount  = 30;
      }
      renderGrid();
      updateCounters();
    }

    // ── Render ─────────────────────────────────────────────────────────────────
    function renderGrid() {
      grid.innerHTML = '';
      for (let i = 0; i < tokenCount; i++) {
        const btn = document.createElement('button');
        btn.className  = 'token';
        btn.textContent = i + 1;
        btn.dataset.index = i;
        applyTokenStyle(btn, tokenStates[i]);
        btn.addEventListener('click', handleTokenClick);
        grid.appendChild(btn);
      }
      badge.textContent = tokenCount + ' tokens';
    }

    function applyTokenStyle(btn, state) {
      btn.classList.remove('patient', 'review');
      if (state === STATE.PATIENT) btn.classList.add('patient');
      if (state === STATE.REVIEW)  btn.classList.add('review');
    }

    function updateCounters() {
      const patients = tokenStates.filter(s => s === STATE.PATIENT).length;
      const reviews  = tokenStates.filter(s => s === STATE.REVIEW).length;
      countPatients.textContent = patients;
      countReviews.textContent  = reviews;
    }

    function saveState() {
      sessionStorage.setItem('trakem-state', JSON.stringify({
        states: tokenStates,
        count:  tokenCount
      }));
    }

    // ── Token Click Logic ──────────────────────────────────────────────────────
    function handleTokenClick(e) {
      const btn   = e.currentTarget;
      const index = parseInt(btn.dataset.index, 10);

      if (clickTimers[index]) {
        // ── Double click ──
        clearTimeout(clickTimers[index]);
        delete clickTimers[index];
        onDoubleClick(index, btn);
      } else {
        // ── Single click (wait to confirm not double) ──
        clickTimers[index] = setTimeout(() => {
          delete clickTimers[index];
          onSingleClick(index, btn);
        }, 220);
      }
    }

    function onSingleClick(index, btn) {
      if (tokenStates[index] === STATE.PATIENT) {
        tokenStates[index] = STATE.IDLE;
      } else {
        tokenStates[index] = STATE.PATIENT;
      }
      animateToken(btn);
      applyTokenStyle(btn, tokenStates[index]);
      updateCounters();
      saveState();
    }

    function onDoubleClick(index, btn) {
      if (tokenStates[index] === STATE.REVIEW) {
        tokenStates[index] = STATE.IDLE;
      } else {
        tokenStates[index] = STATE.REVIEW;
      }
      animateToken(btn);
      applyTokenStyle(btn, tokenStates[index]);
      updateCounters();
      saveState();
    }

    function animateToken(btn) {
      btn.classList.remove('pop');
      void btn.offsetWidth; // reflow to restart animation
      btn.classList.add('pop');
      btn.addEventListener('animationend', () => btn.classList.remove('pop'), { once: true });
    }

    // ── Add Tokens ─────────────────────────────────────────────────────────────
    document.getElementById('btn-add').addEventListener('click', () => {
      const extra = 10;
      tokenStates = [...tokenStates, ...Array(extra).fill(STATE.IDLE)];
      tokenCount += extra;
      renderGrid();
      updateCounters();
      saveState();
    });

    // ── Reset ──────────────────────────────────────────────────────────────────
    document.getElementById('btn-reset').addEventListener('click', () => {
      modalBody.innerHTML = `This will clear all <strong style="color:#fff">${tokenCount}</strong> tokens<br>and reset both counters to zero.`;
      modal.classList.add('visible');
    });
    document.getElementById('modal-cancel').addEventListener('click',  () => modal.classList.remove('visible'));
    document.getElementById('modal-confirm').addEventListener('click', () => {
      modal.classList.remove('visible');
      tokenCount  = 30;
      tokenStates = Array(30).fill(STATE.IDLE);
      renderGrid();
      updateCounters();
      saveState();
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('visible');
    });

    // ── Boot ───────────────────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
